title: 💰 재테크
description: 학습하면서 정리하는 시장·종목 노트. 모닝 리포트와 통계.
author: 최진영(Kcarl)

permalink: /:year/:month/:day/

# KST 발행 포스트가 빌드 시점에 UTC 기준 '미래'로 보일 수 있어 활성화
future: true

# 커스텀 레이아웃 사용 (cayman 테마 제거)

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: default

exclude:
  - designSystem/
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.bak"
