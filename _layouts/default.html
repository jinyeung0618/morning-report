<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">📰 모닝 리포트</a>
      {% if page.url != '/' %}
      <a href="{{ '/' | relative_url }}" class="back-link">← 목록</a>
      {% endif %}
    </div>
  </header>

  <main class="content">
    <div class="container">
      {% if page.date %}
      <article>
        <header class="post-header">
          <time class="post-date">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>
          <h1>{{ page.title }}</h1>
        </header>
        <div class="post-body">
          {{ content }}
        </div>
      </article>
      {% else %}
      {{ content }}
      {% endif %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>매일 10:03 자동 발행 · Author: <strong>최진영(Kcarl)</strong></p>
      <p class="disclaimer">학습·정보 공유 목적. 매수·매도 추천 아님.</p>
    </div>
  </footer>

  <button class="theme-toggle" aria-label="다크 모드 전환" id="themeToggle">
    <span class="theme-icon">🌙</span>
  </button>

  <script>
    (function() {
      const root = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      const icon = toggle.querySelector('.theme-icon');
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initial = stored || (prefersDark ? 'dark' : 'light');
      root.dataset.theme = initial;
      icon.textContent = initial === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
        icon.textContent = next === 'dark' ? '☀️' : '🌙';
      });
    })();
  </script>
</body>
</html>
