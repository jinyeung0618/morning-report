<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">💰 재테크</a>
      {% if page.url != '/' %}
      <a href="{{ '/' | relative_url }}" class="back-link">← 목록</a>
      {% endif %}
    </div>
  </header>

  <main class="content">
    <div class="container">
      {% if page.date %}
      <article>
        <header class="post-header">
          <time class="post-date">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>
          <h1>{{ page.title }}</h1>
        </header>
        <div class="post-body">
          {{ content }}
        </div>
      </article>
      {% else %}
      {{ content }}
      {% endif %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Author: <strong>최진영(Kcarl)</strong> · 모닝 리포트는 매일 평일 10:03 자동 발행</p>
      <p class="disclaimer">학습·정보 공유 목적. 매수·매도 추천 아님.</p>
    </div>
  </footer>

  <button class="theme-toggle" aria-label="다크 모드 전환" id="themeToggle">
    <span class="theme-icon">🌙</span>
  </button>

  <script>
    (function() {
      const root = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      const icon = toggle.querySelector('.theme-icon');
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initial = stored || (prefersDark ? 'dark' : 'light');
      root.dataset.theme = initial;
      icon.textContent = initial === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
        icon.textContent = next === 'dark' ? '☀️' : '🌙';
      });
    })();
  </script>

  {% if page.charts %}
  <script src="{{ '/assets/js/stats.js' | relative_url }}" defer></script>
  {% endif %}

  <script src="{{ '/assets/js/watchlist-sort.js' | relative_url }}" defer></script>

  <!-- Section tab switcher -->
  <script>
    (function () {
      const tabs = document.querySelectorAll('[data-section]');
      if (!tabs.length) return;
      const panels = document.querySelectorAll('.section-panel');

      function activate(name) {
        tabs.forEach(t => t.classList.toggle('is-active', t.dataset.section === name));
        panels.forEach(p => p.classList.toggle('is-active', p.id === 'section-' + name));
        if (location.hash !== '#' + name) {
          history.replaceState(null, '', '#' + name);
        }
        // 통계 탭 진입 시 차트 재렌더 (display:none 상태에서 init되면 canvas 0x0)
        if (name === 'stats' && typeof window._statsRender === 'function') {
          setTimeout(window._statsRender, 50);
        }
      }

      tabs.forEach(tab => tab.addEventListener('click', () => activate(tab.dataset.section)));

      // 초기 활성 탭 — URL hash 우선, 없으면 reports
      const initial = (location.hash || '').replace('#', '');
      activate(initial === 'stats' ? 'stats' : 'reports');
    })();
  </script>
</body>
</html>
