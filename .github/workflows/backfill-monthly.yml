name: Backfill Monthly Summaries

on:
  workflow_dispatch:
    inputs:
      from:
        description: '시작 월 (YYYY-MM, 포함). 기본 2020-01'
        required: false
        type: string
        default: ''
      to:
        description: '종료 월 (YYYY-MM, 포함). 기본 2026-04'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt

      - name: Configure git for bot commits
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Morning Report Bot"

      - name: Run backfill (commits each month inline)
        id: backfill
        continue-on-error: true
        working-directory: .github/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          BACKFILL_FROM: ${{ inputs.from }}
          BACKFILL_TO: ${{ inputs.to }}
        run: python backfill_monthly.py

      - name: Safety-net commit (anything left uncommitted)
        if: always()
        run: |
          if git status --porcelain _posts/ | grep -q .; then
            git add _posts/
            git commit -m "Backfill leftover files"
            git push
          else
            echo "All monthly files already pushed inline."
          fi

      - name: Re-raise backfill status
        if: steps.backfill.outcome == 'failure'
        run: |
          echo "::error::backfill 일부 월 실패. 이전에 푸시된 파일은 보존됨. 실패 월만 다시 트리거하면 됨."
          exit 1
