name: Morning Report

on:
  schedule:
    # 10:03 KST 평일 = 01:03 UTC 평일
    # GitHub Actions cron은 UTC. 최대 15~60분 지연 가능.
    - cron: '3 1 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜로 재생성 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt

      - name: Generate morning report
        working-directory: .github/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REPORT_DATE: ${{ inputs.date }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Morning Report Bot"
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if git status --porcelain _posts/ | grep -q .; then
            git add _posts/
            git commit -m "Morning report ${DATE}"
            git push
          else
            echo "No new report to commit"
            exit 1
          fi
