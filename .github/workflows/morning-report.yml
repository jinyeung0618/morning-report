name: Morning Report

on:
  schedule:
    # GH Actions cron 은 최대 60분 지연 가능 → 여러 시간대 등록해서 한 번은 발사 보장.
    # 첫 슬롯에서 이미 생성됐으면 commit 스텝에서 "No new report" 로 종료 (idempotent).
    - cron: '3 1 * * 1-5'   # 10:03 KST 목표
    - cron: '33 1 * * 1-5'  # 10:33 KST (백업 1)
    - cron: '3 2 * * 1-5'   # 11:03 KST (백업 2)
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜로 재생성 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt

      - name: Generate morning report
        working-directory: .github/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REPORT_DATE: ${{ inputs.date }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Morning Report Bot"
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if git status --porcelain _posts/ | grep -q .; then
            git add _posts/
            git commit -m "Morning report ${DATE}"
            git push
          else
            # 같은 날 이미 생성·푸시됐으면 정상 종료 (백업 cron 들이 idempotent 하게 끝나도록)
            echo "No new report to commit (today already generated)"
          fi
