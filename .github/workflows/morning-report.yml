name: Morning Report

on:
  schedule:
    # 07:00 KST sweet spot (미국 마감 후속 기사 + 한국 조간 뉴스 모두 안착, 한국 장 시작 전).
    # GH Actions cron 60분 지연 고려해 3 슬롯, idempotent (이미 생성됐으면 skip).
    # KST = UTC + 9. 07:00 KST Mon-Fri = 22:00 UTC Sun-Thu.
    - cron: '0 22 * * 0-4'   # 07:00 KST 목표
    - cron: '30 22 * * 0-4'  # 07:30 KST (백업 1)
    - cron: '0 23 * * 0-4'   # 08:00 KST (백업 2)
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜로 재생성 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt

      - name: Generate morning report
        working-directory: .github/scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REPORT_DATE: ${{ inputs.date }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Morning Report Bot"
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if git status --porcelain _posts/ | grep -q .; then
            git add _posts/
            git commit -m "Morning report ${DATE}"
            git push
          else
            # 같은 날 이미 생성·푸시됐으면 정상 종료 (백업 cron 들이 idempotent 하게 끝나도록)
            echo "No new report to commit (today already generated)"
          fi
